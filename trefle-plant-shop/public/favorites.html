<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Favorites | Trefle Plant Shop
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- Header -->

    <header class="header">

        <div class="nav">

            <div class="brand">

                <div class="brand-icon">
                    🌿
                </div>

                <div>

                    <h1>
                        Trefle Plant Shop
                    </h1>

                    <span>
                        Your favorite plants
                    </span>

                </div>

            </div>


            <a
                href="index.html"
                class="favorites-link"
            >
                🌱 Explore Plants
            </a>

        </div>

    </header>


    <!-- Main -->

    <main class="container">

        <section class="result-section">

            <div class="section-heading">

                <div>

                    <span class="small-title">
                        SAVED PLANTS
                    </span>

                    <h2>
                        ❤️ My Favorites
                    </h2>

                </div>

            </div>


            <div
                id="favoriteList"
                class="plant-grid"
            >

                <!-- JavaScript จะนำข้อมูลมาแสดงตรงนี้ -->

                <div class="loading-state">

                    <div class="loading-icon">
                        🌿
                    </div>

                    <h3>
                        Loading favorites...
                    </h3>

                    <p>
                        Please wait a moment.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer class="footer">

        <strong>
            🌿 Trefle Plant Shop
        </strong>

        <span>
            Plant information powered by Trefle API
        </span>

    </footer>


    <script src="favorites.js"></script>

</body>

</html>
